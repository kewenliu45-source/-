<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>系统错误</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 40px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h2 {
            color: red;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            background: #eee;
            padding: 20px;
            border-radius: 8px;
        }

</head>

<body>

    <div class="box">
        <h2>系统运行出错</h2>

        <pre>{{ error }}</pre>
    </div>

</body>

</html>
