<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 智能库存预警系统</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg, #f5f7fa);
        }
        .login-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
        }
        .login-card .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary, #2563eb);
        }
        .login-card .logo-mark {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: var(--primary, #2563eb);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .login-card h2 {
            font-size: 22px;
            margin-bottom: 8px;
            color: var(--text, #1e293b);
        }
        .login-card .subtitle {
            color: var(--text-secondary, #64748b);
            font-size: 14px;
            margin-bottom: 28px;
        }
        .login-card label {
            display: block;
            margin-bottom: 16px;
        }
        .login-card label span {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text, #1e293b);
            margin-bottom: 6px;
        }
        .login-card input[type="text"],
        .login-card input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border, #e2e8f0);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .login-card input:focus {
            border-color: var(--primary, #2563eb);
        }
        .login-card .error-msg {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .login-card .primary-btn {
            width: 100%;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="logo">
            <span class="logo-mark">库</span>
            <span>智能库存预警</span>
        </div>
        <h2>登录</h2>
        <p class="subtitle">请输入账号密码以访问系统</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <label>
                <span>用户名</span>
                <input type="text" name="username" required autofocus placeholder="请输入用户名">
            </label>
            <label>
                <span>密码</span>
                <input type="password" name="password" required placeholder="请输入密码">
            </label>
            <button class="primary-btn" type="submit">登 录</button>
        </form>
    </div>
</div>
</body>
</html>
